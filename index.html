<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Identity Defender · Restore the Access Gates</title>
<meta name="description" content="A 2D top-down puzzle game for learning Microsoft SC-300 Conditional Access.">
<style>
@font-face{font-family:"Kenney Pixel";src:url("assets/kenney-fonts/KenneyPixel.ttf?v=3.0.0") format("truetype");font-display:swap}
@font-face{font-family:"Kenney Future";src:url("assets/kenney-fonts/KenneyFuture.ttf?v=3.0.0") format("truetype");font-display:swap}
:root{--ink:#e8ecfa;--muted:#a7b0cf;--panel:#1a2035;--panel2:#232a45;--line:#3b4366;--cy:#64e0f0;--gr:#42dfab;--rd:#ff6b6b;--am:#f5c84c;--px:"Kenney Pixel",ui-monospace,monospace;--fut:"Kenney Future","Segoe UI",system-ui,sans-serif;--body:system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#151a2a;color:var(--ink);font:15px/1.45 var(--body);overflow:hidden;overscroll-behavior:none}
#game{position:fixed;inset:0;outline:none}
#game canvas{display:block;image-rendering:pixelated}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#ui>*{pointer-events:auto}
#ui #tags,#ui #marker,#ui #you,#ui #toasts{pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:13px var(--px);background:#0e1222;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--am)}
.ki{width:15px;height:15px;vertical-align:-2px;margin-right:5px;opacity:.85}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:7px 12px;cursor:pointer;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.2}
.btn:hover:not(:disabled){border-color:#5b6595;background:#2b3354}
.btn:active:not(:disabled){transform:translateY(1px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--am);border-color:#c79a2b;color:#231a02;font-weight:600}
.btn.primary:hover:not(:disabled){background:#ffd768}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:4px 8px;font-size:13px}
.muted{color:var(--muted)}.small{font-size:13px}.good{color:var(--gr)}.warn{color:var(--am)}.bad{color:var(--rd)}

/* HUD */
.hud{position:absolute;background:rgba(18,23,40,.86);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(4px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
#hud-tl{top:max(10px,env(safe-area-inset-top));left:10px;width:min(300px,calc(100vw - 20px));padding:7px 10px}
#hud-tl summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
#hud-tl summary::-webkit-details-marker{display:none}
.obj-k{font:12px var(--fut);letter-spacing:.12em;color:var(--cy);text-transform:uppercase}
.obj{font:600 14.5px var(--body);margin:1px 0 0}
#hud-level{font:10px var(--fut);letter-spacing:.08em;border:1px solid var(--line);border-radius:99px;padding:0 6px;color:var(--muted);white-space:nowrap;margin-left:6px;vertical-align:1px}
#req-count{font:15px var(--px);color:var(--am);padding-left:6px}
.dots{display:flex;align-items:center;gap:3px;margin-top:4px}.dots i{font-style:normal;width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.dots i.ok{background:var(--gr);border-color:var(--gr);color:#06261a}.dots i.no{border-color:var(--rd);color:var(--rd)}
.more-r{margin-left:auto;font-size:12px;color:var(--cy)}#hud-tl[open] .more-r{visibility:hidden}
#reqs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.rq{display:flex;gap:7px;align-items:center;font-size:13px;line-height:1.3}
.ri{flex:none;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.rq.ok .ri{background:var(--gr);border-color:var(--gr);color:#06261a}.rq.no .ri{border-color:var(--rd);color:var(--rd)}
.rq.ok{color:#d7f8ea}.rq.no{color:#ffd6d6}.rq.bonus{color:var(--muted);font-style:italic}
#hud-tr{top:max(10px,env(safe-area-inset-top));right:10px;padding:6px;display:flex;gap:6px;align-items:center}
#hud-xp,#hud-tests{font:15px var(--px);color:var(--am);padding:0 4px}#hud-tests{color:var(--muted)}
#coach{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(640px,calc(100vw - 24px));background:rgba(18,23,40,.92);border:1px solid var(--line);border-left:3px solid var(--cy);border-radius:9px;padding:8px 14px;font-size:14.5px;text-align:center}
#coach.pop{animation:cpop .35s ease}
@keyframes cpop{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
/* World labels */
#tags{position:absolute;inset:0;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:14px/1 var(--px);text-align:center;pointer-events:none}
.tag.actor{background:rgba(14,18,32,.85);border:1px solid var(--line);border-radius:5px;padding:2px 5px 3px;display:flex;gap:5px;align-items:center}
.tag.actor b{font-weight:400;color:var(--ink)}.tag.actor span{font-size:13px}
.tag.actor.ok{border-color:rgba(66,223,171,.7)}.tag.actor.ok span{color:var(--gr)}
.tag.actor.no{border-color:rgba(255,107,107,.7)}.tag.actor.no span{color:var(--rd)}
.tag.actor.sus b{color:#ffb3c0}
.tag.actor.hl{outline:2px dashed var(--am);outline-offset:3px;animation:hlp 1s ease-in-out infinite}
@keyframes hlp{50%{outline-offset:6px}}
.tag.actor.min span{display:none}
.tag.bld{display:grid;gap:2px;background:rgba(14,18,32,.8);border:1px solid var(--line);border-radius:6px;padding:3px 7px 4px}
.tag.bld b{font:12px var(--fut);letter-spacing:.06em;font-weight:400}.tag.bld span{font-size:13px}
.tag.bld.online{border-color:rgba(66,223,171,.7)}.tag.bld.online span{color:var(--gr)}
.tag.bld.offline span{color:#b9c1dd}.tag.bld.alarm{border-color:var(--rd);background:rgba(80,14,24,.85)}.tag.bld.alarm span{color:#ffb0b0}
.tag.zonetag{display:grid;gap:1px;padding:3px 8px;border-radius:6px;background:rgba(14,18,32,.7);border:1px dashed var(--line)}
.tag.zonetag b{font:12px var(--fut);font-weight:400;letter-spacing:.06em}.tag.zonetag span{font-size:12.5px;color:var(--muted)}
.tag.zonetag.office{border-color:rgba(66,223,171,.6)}.tag.zonetag.net{border-color:rgba(245,200,76,.6)}.tag.zonetag.soc{border-color:rgba(100,224,240,.6)}
.float{position:absolute;transform:translate(-50%,-100%);font:16px var(--px);padding:3px 8px;border-radius:6px;background:rgba(14,18,32,.9);border:1px solid var(--gr);color:var(--gr);animation:flt 2.2s ease forwards;white-space:nowrap}
.float.no{border-color:var(--rd);color:#ffb0b0}
@keyframes flt{0%{opacity:0;margin-top:6px}12%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-14px}}
#prompt{position:absolute;left:0;top:0;display:flex;gap:6px;align-items:center;background:rgba(14,18,32,.94);border:1px solid var(--am);border-radius:7px;padding:4px 9px;font:15px var(--px);color:var(--ink);cursor:pointer;white-space:nowrap}
#prompt[hidden]{display:none}
#marker{position:absolute;left:0;top:0;color:var(--am);font-size:22px;text-shadow:0 2px 0 #000;animation:bob .8s ease-in-out infinite}
@keyframes bob{50%{margin-top:-6px}}
#you{position:absolute;left:0;top:0;font:13px var(--px);color:var(--am)}
/* Panels */
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 20px));max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cy);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);padding:14px 16px}
#panel.evidence,#panel.log,#panel.worked{width:min(520px,calc(100vw - 20px))}
#panel h2{font:17px var(--fut);font-weight:400;letter-spacing:.03em;margin:0}
#panel h3{font:12px var(--fut);font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.ph{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ev-head{display:flex;gap:10px;align-items:center}.ev-head p{margin:0;color:var(--muted);font-size:13px}.ev-head .res{margin-left:auto}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#2b3660;font:15px var(--px)}
.av.k-attacker{background:#56202f;color:#ffb3c0}.av.k-admin{background:#4c3d12;color:#ffe2a6}
.res{font:14px var(--px);padding:2px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}.res.ok{color:var(--gr);border-color:rgba(66,223,171,.6)}.res.no{color:var(--rd);border-color:rgba(255,107,107,.6)}
dl.ev{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 0;font-size:14px}
dl.ev dt{color:var(--muted);white-space:nowrap}dl.ev dd{margin:0}
.ev-ca ul{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:13.5px}
.ev-ca li{padding:4px 8px;border-left:3px solid var(--line);background:#141a2e;border-radius:4px}
.ev-ca li b{font:14px var(--px);color:var(--cy);margin-right:4px}.ev-ca .pok{border-left-color:var(--gr)}.ev-ca .pno{border-left-color:var(--rd)}.ev-ca .pna{color:var(--muted)}.ev-ca .prep{border-left-style:dashed}
.ev-sum{font-weight:600;margin:6px 0 0}
.loglist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.logrow{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
.logrow:hover{border-color:#5b6595}.lr-main{display:grid;flex:1;min-width:0}.lr-main span{font-size:12.5px;color:var(--muted)}
/* Console */
.ctip{margin:0 0 8px;font-size:13.5px;background:rgba(100,224,240,.08);border:1px solid rgba(100,224,240,.3);border-radius:8px;padding:6px 10px}
.cgrid{display:grid;grid-template-columns:190px 1fr;gap:12px}
@media (max-width:640px){.cgrid{grid-template-columns:1fr}.ptabs{display:flex!important;overflow:auto}}
.ptabs{display:grid;gap:6px;align-content:start}
.ptab{display:grid;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;min-width:150px}
.ptab b{font:15px var(--px);color:var(--cy);font-weight:400}.ptab span{font-size:13px}.ptab i{font-style:normal;font:13px var(--px);color:var(--muted)}
.ptab.sel{border-color:var(--am);box-shadow:inset 0 0 0 1px var(--am)}.ptab.st-on i{color:var(--gr)}.ptab.st-report i{color:var(--am)}
.ped{display:grid;gap:8px}.ped-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}.ped-head h3{margin:0!important;color:var(--ink)!important;font-size:14px!important;letter-spacing:.04em!important;text-transform:none!important}
.changed{font:13px var(--px);color:var(--am)}
.grp{border-top:1px solid var(--line);padding-top:4px;display:grid;gap:8px}.grp h4{margin:0;font:11px var(--fut);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:400}
.row{border:0;margin:0;padding:0;min-width:0;border-radius:6px}.rl{font-size:12.5px;color:var(--muted);padding:0;display:block;margin-bottom:3px}
.row.locked{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:13.5px}.row.locked .rl{margin:0}
.lock .ki{width:12px;height:12px;opacity:.6}
.row.hl{outline:2px dashed var(--am);outline-offset:3px}
.segs{display:flex;flex-wrap:wrap;gap:4px}.segs.col{flex-direction:column}
.seg{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#121729;border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:34px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}.seg.chk input{position:static;opacity:1;width:16px;height:16px;accent-color:var(--am);margin:0}
.seg.on{border-color:var(--am);background:rgba(245,200,76,.12);color:#ffe9b0}.seg:not(.chk).on::before{content:"●";font-size:9px}
.seg:focus-within{outline:2px solid var(--am);outline-offset:1px}
.err{color:var(--rd);margin:8px 0 0;font-size:14px}
/* Banner, prediction, debrief, menu */
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center}
.bn-in{background:rgba(14,30,26,.94);border:2px solid var(--gr);border-radius:12px;padding:14px 22px;box-shadow:0 0 40px rgba(66,223,171,.35)}
.bn-in p{margin:6px 0 10px}
.stamp{display:inline-block;font:22px var(--fut);letter-spacing:.18em;color:var(--gr);border:3px solid var(--gr);padding:3px 12px;border-radius:6px;transform:rotate(-3deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
.stamp.sm{font-size:13px;border-width:2px;padding:1px 6px}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
#predict{position:absolute;left:0;top:0;width:min(330px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--am);border-radius:12px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#predict p{margin:0 0 6px}.pk{font:11px var(--fut);letter-spacing:.14em;color:var(--am);text-transform:uppercase}
.popts{display:grid;gap:6px;margin:6px 0}.popts .btn{justify-content:center}
.db3{margin:4px 0 0;padding-left:22px;display:grid;gap:8px;font-size:15px}.db3 li::marker{font:16px var(--px);color:var(--am)}
details.more,#panel details{margin-top:8px;font-size:14px}#panel summary{cursor:pointer;color:var(--cy)}#panel details p,#panel details li{color:#cbd2ea}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.mcol{display:grid;gap:6px}
.fld{display:grid;gap:3px;font-size:13px;color:var(--muted);margin-bottom:8px}.fld select{background:#121729;border:1px solid var(--line);border-radius:6px;padding:6px;color:var(--ink)}
.chkl{display:flex;gap:6px;align-items:center;font-size:13.5px}
/* Toasts */
#toasts{position:absolute;right:12px;top:64px;display:grid;gap:6px;justify-items:end}
.toast{background:rgba(18,23,40,.95);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13.5px;animation:tin .3s ease;max-width:min(380px,90vw)}
.toast.xp{border-color:var(--am);color:#ffe9b0;font:15px var(--px)}.toast.ok{border-color:var(--gr)}.toast.no{border-color:var(--rd)}
@keyframes tin{from{transform:translateX(20px);opacity:0}}
/* Touch */
#ui.busy #touch{display:none}
#touch{position:absolute;inset:auto 0 0 0;height:0}
#tpad{position:absolute;left:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(18,23,40,.55);border:2px solid var(--line);touch-action:none}
#tpad .knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(245,200,76,.8);border:2px solid #c79a2b}
#tact{position:absolute;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;background:rgba(245,200,76,.85);border:3px solid #c79a2b;color:#231a02;font:20px var(--px)}
/* Loading */
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#151a2a;z-index:10;transition:opacity .4s}
#loading .in{text-align:center}#loading h1{font:26px var(--fut);font-weight:400;letter-spacing:.2em;margin:0 0 12px}
#loading .bar{width:220px;height:8px;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:0 auto}#loadbar{display:block;height:100%;width:0;background:var(--am)}
@media (max-width:560px){#hud-tr{left:10px;right:10px;justify-content:flex-end}#hud-tl{top:calc(56px + env(safe-area-inset-top));width:calc(100vw - 20px)}#toasts{top:150px!important}}
@media (max-width:700px){#hud-tl:not([open]) .obj{font-size:13px}#hud-xp{display:none}#coach{bottom:calc(206px + env(safe-area-inset-bottom));font-size:13.5px}#toasts{top:110px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="game" tabindex="-1" aria-label="Identity Defender game world"></div>
<div id="ui">
  <details id="hud-tl" class="hud">
    <summary><div style="flex:1"><div class="obj-k">Objective <span id="hud-level">Guided</span></div><p class="obj">Restore employee access and stop the suspicious sign-in.</p><div class="dots"><span id="req-dots"></span><span id="req-count"></span><span class="more-r">Requirements ▾</span></div></div></summary>
    <ul id="reqs" aria-label="Requirements"></ul>
  </details>
  <div id="hud-tr" class="hud"><span id="hud-tests"></span><span id="hud-xp"></span>
    <button class="btn small" id="btn-hint" onclick="UI.hint()" title="Hint (H)">Hint</button>
    <button class="btn small" onclick="UI.openLog()" title="Sign-in logs (L)">Logs</button>
    <button class="btn small" data-ui="menu" title="Menu (Esc)">☰ Menu</button></div>
  <div id="tags" aria-hidden="true"></div>
  <button id="prompt" hidden onclick="window.__ID_GAME && window.__ID_GAME.interact()"><kbd>E</kbd><span class="pt"></span></button>
  <div id="marker" hidden aria-hidden="true">▼</div>
  <div id="you" hidden aria-hidden="true">You</div>
  <div id="coach" role="status"></div>
  <div id="panel" hidden></div>
  <div id="predict" hidden></div>
  <div id="banner" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="touch" hidden><div id="tpad" aria-label="Movement pad"><div class="knob"></div></div><button id="tact" aria-label="Interact">Use</button></div>
  <p id="live" class="sr-only" aria-live="polite"></p>
</div>
<div id="loading"><div class="in"><h1>IDENTITY DEFENDER</h1><div class="bar"><span id="loadbar"></span></div><p class="muted small">Loading the Halcyon campus…</p></div></div>
<noscript><p style="padding:20px">This game needs JavaScript. The <a href="library.html">study library</a> also needs JavaScript.</p></noscript>
<script src="vendor/phaser.min.js?v=3.90.0"></script>
<script>window.ID_CONTENT = window.ID_CONTENT || { items:{} };</script>
<script src="js/lab-missions.js?v=3.0.0"></script>
<script src="js/ca-engine.js?v=3.0.0"></script>
<script src="js/progress.js?v=3.0.0"></script>
<script src="js/ui.js?v=3.0.0"></script>
<script src="js/main.js?v=3.0.0"></script>
<script>
  window.IDGame.start();
  (function hide(){ const L = document.getElementById("loading"); const t = setInterval(() => { if (window.__ID_GAME && window.__ID_GAME.ready){ clearInterval(t); L.style.opacity = 0; setTimeout(() => L.remove(), 450); } }, 100); })();
</script>
</body>
</html>
